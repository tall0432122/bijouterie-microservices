# Service du frontend :
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  type: NodePort             
  selector:                  
    app: bijouterie
    tier: frontend
  ports:
    - port: 80               
      targetPort: 80         
      nodePort: 30080        