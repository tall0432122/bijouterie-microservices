# Deployment du frontend : garde 2 pods Nginx en marche.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  replicas: 2              # 2 pods 
  selector:
    matchLabels:           # le Deployment gere les pods avec ces labels   
      app: bijouterie
      tier: frontend
  template:              # modele des pods a creer      
    metadata:
      labels:           # doivent correspondre au selector ci-dessus      
        app: bijouterie
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: mamadoutall/bijouterie-frontend:9      # image Docker Hub, tag explicite
          ports:
            - containerPort: 80                  # port de Nginx    
          envFrom:                                # toutes les cles de la ConfigMap   
            - configMapRef:
                name: frontend-config
          resources:
            requests:                           # minimum reserve
              cpu: "50m"
              memory: "64Mi"
            limits:                            # maximum autorise     
              cpu: "200m"
              memory: "128Mi"