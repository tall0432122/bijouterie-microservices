# Deployment du frontend : garde 2 pods Nginx en marche.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  replicas: 2                 
  selector:
    matchLabels:              
      app: bijouterie
      tier: frontend
  template:                    
    metadata:
      labels:                 
        app: bijouterie
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: mamadoutall/bijouterie-frontend:1  
          ports:
            - containerPort: 80                      
          envFrom:                                   
            - configMapRef:
                name: frontend-config
          resources:
            requests:                           
              cpu: "50m"
              memory: "64Mi"
            limits:                                 
              cpu: "200m"
              memory: "128Mi"