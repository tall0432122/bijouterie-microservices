# Deployment du backend : 2 pods de l'API Node.js en marche
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2                  # 2 pods
  selector:                
    matchLabels:              # le Deployment gere les pods avec ces labels 
      app: bijouterie
      tier: backend
  template:                 # modele des pods a creer         
    metadata:
      labels:                 # doivent correspondre au selector ci-dessus
        app: bijouterie		
        tier: backend
    spec:
      containers:
        - name: backend
          image: mamadoutall/bijouterie-backend:9      # image Docker
          ports:
            - containerPort: 3000             # port de l'API
          envFrom:                            # METHODE 1 : toutes les cles de la ConfigMap    
            - configMapRef:
                name: backend-config
          env:                                  # METHODE 2 : une cle a la fois
            - name: DB_USER                    # nom de la variable dans le conteneur
              valueFrom:
                secretKeyRef:
                  name: backend-secret      # le Secret
                  key: DB_USER          
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          resources:
            requests:                  # minimum reserve
              cpu: "100m"                    
              memory: "128Mi"
            limits:                     # maximum autorise
              cpu: "250m"
              memory: "256Mi"