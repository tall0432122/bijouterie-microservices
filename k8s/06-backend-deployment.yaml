# Deployment du backend :
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2                  # 2 pods
  selector:
    matchLabels:               
      app: bijouterie
      tier: backend
  template:                    
    metadata:
      labels:                 
        app: bijouterie
        tier: backend
    spec:
      containers:
        - name: backend
          image: mamadoutall/bijouterie-backend:1  
          ports:
            - containerPort: 3000             
          envFrom:                                 
            - configMapRef:
                name: backend-config
          env:                                  
            - name: DB_USER                   
              valueFrom:
                secretKeyRef:
                  name: backend-secret     
                  key: DB_USER          
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          resources:
            requests:                  
              cpu: "100m"
              memory: "128Mi"
            limits:             
              cpu: "250m"
              memory: "256Mi"